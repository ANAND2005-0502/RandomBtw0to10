<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binary Guess</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="game-panel" aria-labelledby="appTitle">
      <div class="title-row">
        <div>
          <p class="eyebrow">Random number game</p>
          <h1 id="appTitle">Binary Guess</h1>
        </div>
        <button id="newRoundButton" class="icon-button" type="button" aria-label="Start new round" title="Start new round">
          <span aria-hidden="true">+</span>
        </button>
      </div>

      <div class="stats-grid" aria-label="Round stats">
        <div>
          <span>Range</span>
          <strong id="rangeText">0 to 10</strong>
        </div>
        <div>
          <span>Attempts</span>
          <strong id="attemptsText">0</strong>
        </div>
        <div>
          <span>Points</span>
          <strong id="scoreText">0</strong>
        </div>
      </div>

      <div class="range-meter" aria-hidden="true">
        <div id="meterFill"></div>
      </div>

      <div id="binaryMarks" class="binary-marks" aria-label="Number range"></div>

      <p id="statusText" class="status-text" aria-live="polite"></p>

      <form id="guessForm" class="guess-form">
        <label for="guessInput">Your guess</label>
        <div class="guess-controls">
          <input id="guessInput" type="number" min="0" max="10" step="1" inputmode="numeric" autocomplete="off">
          <button class="primary-button" type="submit">Guess</button>
        </div>
      </form>

      <div class="hint-row">
        <div>
          <span>Binary search pick</span>
          <strong id="suggestionText">5</strong>
        </div>
        <button id="hintButton" class="secondary-button" type="button">Use pick</button>
      </div>
    </section>

    <aside class="history-panel" aria-labelledby="historyTitle">
      <h2 id="historyTitle">Guess Path</h2>
      <ol id="historyList"></ol>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
